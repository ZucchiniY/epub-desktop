[package]
name = "epub-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "epub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
epub-builder = "0.8.3"
reqwest = { version = "0.12", features = ["blocking", "gzip"] }
scraper = "0.22"
url = "2"
encoding_rs = "0.8"

[dev-dependencies]
epub = "2.1.5"
